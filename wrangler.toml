# Cloudflare Pages configuration for the Gaydio website (gaydio-main-site).
#
# Pages project "gaydio-main", connected to Git in the Cloudflare dashboard:
# production branch main, build command "npm run build", build output
# directory "dist". Every push to main, including every Publish in the hub's
# Site Editor, rebuilds and republishes. Branch pushes (the Site Editor's
# drafts) build as previews at <alias>.gaydio-main.pages.dev.
#
# Pages, not a Worker, on purpose (18 Oct 2026): the hub's Site Editor is
# built for Pages projects (draft previews on branch aliases, cache purge,
# the site list), and the other five Gaydio sites run the same way. The
# dashboard's Create flow once made a Worker from this repository
# (gaydio-main-site.gaydio.workers.dev, version 0.1.1); it was deleted and
# this file went back to the Pages shape. Pages reads this file only for
# pages_build_output_dir; a Worker-shaped file here makes it warn and skip.
#
# While it is being built the site has no custom domain, is served only at
# gaydio-main.pages.dev behind a Cloudflare Access application for two
# people, and stays hidden from search engines (robots.txt, X-Robots-Tag and
# a noindex tag on every page) until a build is run with PUBLIC_SITE=true.
# gaydio.co.uk's DNS is not touched by anything here.

name = "gaydio-main"
compatibility_date = "2025-06-01"
pages_build_output_dir = "./dist"
